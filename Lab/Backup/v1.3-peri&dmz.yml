version: "3.8"

services:
  # =========================================================
  # Perimeter Firewall
  # External side: 192.168.10.254/24
  # DMZ side:      10.0.10.1/24
  # Only forwards 443 to NGINX
  # =========================================================
  peri-fw:
    image: alpine:3.20
    container_name: peri-fw
    cap_add:
      - NET_ADMIN
    ports:
      - "8443:443"
    command: >
      sh -c "
        apk add --no-cache iptables socat &&
        iptables -P INPUT DROP &&
        iptables -P FORWARD DROP &&
        iptables -P OUTPUT ACCEPT &&
        iptables -A INPUT -i lo -j ACCEPT &&
        iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT &&
        iptables -A INPUT -p tcp --dport 443 -j ACCEPT &&
        exec socat TCP-LISTEN:443,fork,reuseaddr TCP:10.0.10.10:443
      "
    networks:
      peri_net:
        ipv4_address: 192.168.10.254
      dmz_net:
        ipv4_address: 10.0.10.254
    restart: unless-stopped

  # =========================================================
  # DMZ NGINX Reverse Proxy
  # DMZ IP: 10.0.10.10/24
  # Proxies only to internal firewall
  # =========================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: dmz-nginx
    depends_on:
      - internal-firewall
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/peri:/etc/nginx/certs:ro
    networks:
      dmz_net:
        ipv4_address: 10.0.10.10
    restart: unless-stopped

  # =========================================================
  # Internal Firewall
  # DMZ side:  10.0.10.20/24
  # CDE side:  10.100.10.1/24
  # Only accepts traffic from NGINX and forwards to app
  # =========================================================
  internal-firewall:
    image: alpine:3.20
    container_name: inter-fw
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache iptables socat &&
        iptables -P INPUT DROP &&
        iptables -P FORWARD DROP &&
        iptables -P OUTPUT ACCEPT &&
        iptables -A INPUT -i lo -j ACCEPT &&
        iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT &&
        iptables -A INPUT -p tcp -s 10.0.10.10 --dport 8000 -j ACCEPT &&
        exec socat TCP-LISTEN:8000,fork,reuseaddr TCP:10.100.10.10:8000
      "
    networks:
      dmz_net:
        ipv4_address: 10.0.10.20
      vlan110:
        ipv4_address: 10.100.10.254
    restart: unless-stopped

  # =========================================================
  # Application Server
  # CDE app network: 10.100.10.0/24
  # KMS network:     10.100.20.0/24
  # DB network:      10.100.30.0/24
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cde-app
    command: uvicorn app.app:app --host 0.0.0.0 --port 8000
    environment:
      - KMS_HOST=10.100.20.10
      - KMS_PORT=8001
      - DB_HOST=10.100.30.10
      - DB_PORT=5432
      - DB_NAME=cde_db
      - DB_USER=cde_user
      - DB_PASSWORD=SecurePass123!
    networks:
      vlan110:
        ipv4_address: 10.100.10.10
      vlan120:
        ipv4_address: 10.100.20.20
      vlan130:
        ipv4_address: 10.100.30.20
    depends_on:
      kms:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================
  # KMS
  # =========================================================
  kms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cde-kms
    command: uvicorn kms.main:app --host 0.0.0.0 --port 8001
    environment:
      - MASTER_KEY=${MASTER_KEY:-}
    networks:
      vlan120:
        ipv4_address: 10.100.20.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: cde-postgres
    environment:
      - POSTGRES_DB=cde_db
      - POSTGRES_USER=cde_user
      - POSTGRES_PASSWORD=SecurePass123!
    networks:
      vlan130:
        ipv4_address: 10.100.30.10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cde_user -d cde_db"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  peri_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24

  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.10.0/24

  vlan110:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.100.10.0/24

  vlan120:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.100.20.0/24

  vlan130:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.100.30.0/24

volumes:
  postgres_data:
    driver: local