version: '3.8'

services:
  # ================================================
  # Internal Firewall (DMZ Boundary Enforcement)
  # ================================================
  internal-firewall:
    image: alpine:latest
    container_name: cde-firewall
    cap_add:
      - NET_ADMIN
    ports:
      - "8000:8000" # Only approved entry point from Host/DMZ
    command: >
      sh -c "
        apk add --no-cache iptables socat &&
        # Enforce Deny by Default Policy
        iptables -P INPUT DROP &&
        iptables -P FORWARD DROP &&
        iptables -P OUTPUT ACCEPT &&
        # Allow loopback & established connections
        iptables -A INPUT -i lo -j ACCEPT &&
        iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT &&
        # Allow inbound traffic ONLY on port 8000
        iptables -A INPUT -p tcp --dport 8000 -j ACCEPT &&
        # Forward approved traffic to the CDE App
        socat TCP-LISTEN:8000,fork TCP:10.100.10.10:8000
      "
    networks:
      dmz_net:
      vlan110:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================================
  # Application Server
  # ================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cde-app
    command: uvicorn app.app:app --host 0.0.0.0 --port 8000
    environment:
      - KMS_HOST=10.100.20.10
      - KMS_PORT=8001
      - DB_HOST=10.100.30.10
      - DB_PORT=5432
      - DB_NAME=cde_db
      - DB_USER=cde_user
      - DB_PASSWORD=SecurePass123!
    # REMOVED PORTS: No longer accessible directly from host; forced through firewall
    networks:
      vlan110:
        ipv4_address: 10.100.10.10
      vlan120:
        ipv4_address: 10.100.20.20
      vlan130:
        ipv4_address: 10.100.30.20
    depends_on:
      kms:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================================
  # Key Management Service (Isolated on VLAN 120)
  # ================================================
  kms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cde-kms
    command: uvicorn kms.main:app --host 0.0.0.0 --port 8001
    environment:
      - MASTER_KEY=${MASTER_KEY:-}
    # REMOVED PORTS: No longer accessible from the host machine
    networks:
      vlan120:
        ipv4_address: 10.100.20.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ================================================
  # PostgreSQL Database (Isolated on VLAN 130)
  # ================================================
  postgres:
    image: postgres:16-alpine
    container_name: cde-postgres
    environment:
      - POSTGRES_DB=cde_db
      - POSTGRES_USER=cde_user
      - POSTGRES_PASSWORD=SecurePass123!
    # REMOVED PORTS: No longer accessible from the host machine
    networks:
      vlan130:
        ipv4_address: 10.100.30.10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cde_user -d cde_db"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

# ================================================
# Network definitions for VLAN simulation
# ================================================
networks:
  dmz_net:
    driver: bridge # External facing network for the firewall

  vlan110:
    driver: bridge
    internal: true # Isolates App network from host
    ipam:
      config:
        - subnet: 10.100.10.0/24

  vlan120:
    driver: bridge
    internal: true # COMPLETELY ISOLATED
    ipam:
      config:
        - subnet: 10.100.20.0/24

  vlan130:
    driver: bridge
    internal: true # COMPLETELY ISOLATED
    ipam:
      config:
        - subnet: 10.100.30.0/24

volumes:
  postgres_data:
    driver: local