services:
  # ====================================================
  #                     POS / Retailer
  # ====================================================
  pos:
    image: alpine:3.23
    container_name: pos
    command: sleep infinity
    networks:
      ext_net:
        ipv4_address: 192.168.10.20

  # ====================================================
  #                   Firewall & DMZ
  # ====================================================
  perimeter-fw:
    build: ./fw
    container_name: perimeter-fw
    environment:
      FW_ROLE: perimeter
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      ext_net:
      vlan20_dmz:
        ipv4_address: 10.0.10.1

  dmz-server:
    image: alpine:3.23
    container_name: dmz-server
    command: sleep infinity
    networks:
      vlan20_dmz:
        ipv4_address: 10.0.10.10

  internal-fw:
    build: ./fw
    container_name: internal-fw
    environment:
      FW_ROLE: internal
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      vlan20_dmz:
        ipv4_address: 10.0.10.2
      vlan110_app:
        ipv4_address: 10.100.10.1
      vlan120_kms:
        ipv4_address: 10.100.20.1
      vlan130_db:
        ipv4_address: 10.100.30.1
      vlan200_log:
        ipv4_address: 10.200.10.1

  # ====================================================
  #             Cardholder Data Environment
  # ====================================================
  app-server:
    image: alpine:3.23
    container_name: app-server
    command: sleep infinity
    networks:
      vlan110_app:
        ipv4_address: 10.100.10.10
      vlan120_kms:
        ipv4_address: 10.100.20.5
      vlan130_db:
        ipv4_address: 10.100.30.5
      vlan200_log:
        ipv4_address: 10.200.10.5

  kms:
    image: alpine:3.23
    container_name: kms
    command: sleep infinity
    networks:
      vlan120_kms:
        ipv4_address: 10.100.20.10
      vlan200_log:
        ipv4_address: 10.200.10.6

  db:
    image: postgres:18.4
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cde
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      vlan130_db:
        ipv4_address: 10.100.30.10
      vlan200_log:
        ipv4_address: 10.200.10.7

  # ====================================================
  #             Centralized Audit & Logging
  # ====================================================
  log-server:
    image: alpine:3.23
    container_name: log-server
    command: sh -c "apk add --no-cache socat && socat -v UDP-RECV:514 STDOUT"
    networks:
      vlan200_log:
        ipv4_address: 10.200.10.10

# ====================================================
#                     Networks
# ====================================================
networks:
  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.253
  vlan20_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.10.0/24
          gateway: 10.0.10.254
  vlan110_app:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.10.0/24
          gateway: 10.100.10.254
  vlan120_kms:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.20.0/24
          gateway: 10.100.20.254
  vlan130_db:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.30.0/24
          gateway: 10.100.30.254
  vlan200_log:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.10.0/24
          gateway: 10.200.10.254

# Not In Use

  vlan99_jump:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.99.0/24
          gateway: 10.50.99.1
  vlan51_branch:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.51.0/24
          gateway: 10.50.51.1
  vlan52_ops:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.52.0/24
          gateway: 10.50.52.1
  vlan53_compliance:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.53.0/24
          gateway: 10.50.53.1
  vlan54_finance:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.54.0/24
          gateway: 10.50.54.1
  vlan55_it:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.55.0/24
          gateway: 10.50.55.1
  vlan56_itsec:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.56.0/24
          gateway: 10.50.56.1

# ====================================================
#                      Volumes
# ====================================================

volumes:
  pgdata: