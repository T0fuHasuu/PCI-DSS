user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    upstream fastapi_backend {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    server {
        listen 9443 ssl;
        server_name demo-api.internal;

        ssl_certificate     /etc/lab/pki/server.crt;
        ssl_certificate_key /etc/lab/pki/server.key;
        ssl_client_certificate /etc/lab/pki/ca.crt;
        ssl_verify_client on;

        ssl_protocols TLSv1.2;
        ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;

        client_max_body_size 64k;

        location / {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Client-Certificate-Verified $ssl_client_verify;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
            proxy_send_timeout 30s;
        }
    }
}
