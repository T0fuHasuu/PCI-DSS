global(workDirectory="/var/lib/rsyslog")

module(load="imudp")

template(name="RemoteLine" type="string"
  string="%timereported:::date-rfc3339% host=%fromhost-ip% app=%programname% msg=%msg:::drop-last-lf%\n")

ruleset(name="remote_ingest") {
  if ($rawmsg contains "PERI_FW_ALLOW" or $rawmsg contains "PERI_FW_DROP") then {
    action(
      type="omfile"
      file="/var/log/remote/perimeter-firewall.log"
      template="RemoteLine"
      createDirs="on"
      fileCreateMode="0640"
      flushOnTXEnd="on"
    )
    stop
  }

  if ($rawmsg contains "INT_FW_ALLOW" or $rawmsg contains "INT_FW_DROP") then {
    action(
      type="omfile"
      file="/var/log/remote/internal-firewall.log"
      template="RemoteLine"
      createDirs="on"
      fileCreateMode="0640"
      flushOnTXEnd="on"
    )
    stop
  }

  if ($rawmsg contains "CDE_TRANSACTION") then {
    action(
      type="omfile"
      file="/var/log/remote/cde-transactions.log"
      template="RemoteLine"
      createDirs="on"
      fileCreateMode="0640"
      flushOnTXEnd="on"
    )
    stop
  }

  action(
    type="omfile"
    file="/var/log/remote/other.log"
    template="RemoteLine"
    createDirs="on"
    fileCreateMode="0640"
    flushOnTXEnd="on"
  )
}

input(
  type="imudp"
  address="0.0.0.0"
  port="514"
  ruleset="remote_ingest"
)
