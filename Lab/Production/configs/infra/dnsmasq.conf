port=53
bind-interfaces
listen-address=192.168.10.200
listen-address=10.0.10.200
listen-address=10.100.10.200
listen-address=10.100.20.200
listen-address=10.100.30.200
no-resolv
no-hosts
domain-needed
bogus-priv
cache-size=256
log-queries
log-facility=-

# These are authoritative local-only zones. The local directives prevent
# dnsmasq from forwarding IPv6/AAAA lookups for IPv4-only lab records, which
# otherwise produces REFUSED when no upstream resolver is configured.
local=/gateway/
local=/internal/

host-record=payment.gateway,10.255.0.1
host-record=app.internal,10.100.10.10
host-record=vault.internal,10.100.20.10
host-record=db.internal,10.100.30.10
host-record=log.internal,10.100.10.200
