user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format pci '$remote_addr - $request_method $uri $status '
                   '$body_bytes_sent request_time=$request_time '
                   'upstream=$upstream_addr upstream_status=$upstream_status';
    access_log syslog:server=10.0.10.200:514,facility=local6,tag=dmz_access,severity=info pci;
    error_log  syslog:server=10.0.10.200:514,facility=local6,tag=dmz_error warn;

    upstream app_backend {
        server 10.0.10.254:8443;
        keepalive 8;
    }

    server {
        listen 443 ssl;
        server_name payment.gateway;

        ssl_certificate     /etc/lab/pki/server.crt;
        ssl_certificate_key /etc/lab/pki/server.key;
        ssl_protocols TLSv1.2;
        ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;
        ssl_session_timeout 5m;

        client_max_body_size 32k;
        client_body_timeout 10s;
        keepalive_timeout 15s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;

        location = /health {
            proxy_pass https://app_backend/health;
            proxy_set_header Host app.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            proxy_ssl_protocols TLSv1.2;
            proxy_ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/lab/pki/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name app.internal;
            proxy_ssl_certificate /etc/lab/pki/client.crt;
            proxy_ssl_certificate_key /etc/lab/pki/client.key;
        }

        location = /process-transaction {
            limit_except POST { deny all; }
            proxy_pass https://app_backend/process-transaction;
            proxy_set_header Host app.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            proxy_ssl_protocols TLSv1.2;
            proxy_ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/lab/pki/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name app.internal;
            proxy_ssl_certificate /etc/lab/pki/client.crt;
            proxy_ssl_certificate_key /etc/lab/pki/client.key;
        }


        location ~ ^/transaction/[0-9]+/evidence$ {
            limit_except GET { deny all; }
            proxy_pass https://app_backend;
            proxy_set_header Host app.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            proxy_ssl_protocols TLSv1.2;
            proxy_ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/lab/pki/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name app.internal;
            proxy_ssl_certificate /etc/lab/pki/client.crt;
            proxy_ssl_certificate_key /etc/lab/pki/client.key;
        }

        location ~ ^/transaction/[0-9]+$ {
            limit_except GET { deny all; }
            proxy_pass https://app_backend;
            proxy_set_header Host app.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;

            proxy_ssl_protocols TLSv1.2;
            proxy_ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/lab/pki/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name app.internal;
            proxy_ssl_certificate /etc/lab/pki/client.crt;
            proxy_ssl_certificate_key /etc/lab/pki/client.key;
        }

        location / {
            return 404;
        }
    }
}
