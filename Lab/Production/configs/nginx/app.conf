user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;

    log_format pci '$remote_addr - $request_method $uri $status '
                   '$body_bytes_sent request_time=$request_time';
    access_log syslog:server=10.100.10.200:514,facility=local6,tag=app_proxy_access,severity=info pci;
    error_log  syslog:server=10.100.10.200:514,facility=local6,tag=app_proxy_error warn;

    upstream fastapi_backend {
        server 127.0.0.1:8000;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        server_name app.internal;

        ssl_certificate     /etc/lab/pki/server.crt;
        ssl_certificate_key /etc/lab/pki/server.key;
        ssl_protocols TLSv1.2;
        ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;

        ssl_client_certificate /etc/lab/pki/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        client_max_body_size 32k;
        add_header Cache-Control no-store always;

        location = /health {
            proxy_pass http://fastapi_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        }

        location = /process-transaction {
            limit_except POST { deny all; }
            proxy_pass http://fastapi_backend/process-transaction;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
            proxy_connect_timeout 3s;
            proxy_read_timeout 25s;
        }

        location ~ ^/transaction/[0-9]+/evidence$ {
            limit_except GET { deny all; }
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        }

        location ~ ^/transaction/[0-9]+$ {
            limit_except GET { deny all; }
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        }

        location / {
            return 404;
        }
    }
}
