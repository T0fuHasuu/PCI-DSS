# Local bootstrap and local health checks.
local   all       all                                  trust

# App -> PostgreSQL: TLS plus a trusted client certificate whose CN is cde_user.
hostssl cde_db    cde_user   10.100.30.20/32           cert

# Reject plaintext and all other network sources.
hostnossl all     all        0.0.0.0/0                  reject
host      all     all        0.0.0.0/0                  reject
