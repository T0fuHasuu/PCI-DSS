user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8443 ssl;
        server_name pci-demo.local localhost;

        ssl_certificate     /etc/lab/pki/server.crt;
        ssl_certificate_key /etc/lab/pki/server.key;
        ssl_protocols TLSv1.2;
        ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'" always;

        location /api/ {
            proxy_pass https://172.30.10.20:9443/;
            proxy_http_version 1.1;
            proxy_set_header Host demo-api.internal;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
            proxy_send_timeout 30s;

            proxy_ssl_protocols TLSv1.2;
            proxy_ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/lab/pki/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name demo-api.internal;
            proxy_ssl_certificate /etc/lab/pki/client.crt;
            proxy_ssl_certificate_key /etc/lab/pki/client.key;
        }

        location = /health {
            return 200 '{"status":"healthy"}';
            default_type application/json;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
